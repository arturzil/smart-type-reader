<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>SmartBook Cyber-Type v2.5</title>
  <style>
    :root {
      --bg-color: #0d0f17;
      --card-bg: #161925;
      --accent-color: #00f0ff;
      --text-main: #e2e8f0;
      --text-dim: #475569;
      --typed-color: #10b981;
      --error-bg: rgba(239, 68, 68, 0.35);
      --error-color: #f87171;
      --ru-color: #94a3b8;
      --ai-color: #b026ff;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'JetBrains Mono', 'Fira Code', 'Consolas', system-ui, monospace;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      display: flex;
      justify-content: center;
      align-items: flex-start;
      min-height: 100vh;
      padding: 15px 10px;
    }

    .container {
      background-color: var(--card-bg);
      border: 1px solid rgba(0, 240, 255, 0.2);
      border-radius: 14px;
      padding: 16px;
      max-width: 800px;
      width: 100%;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
      margin-top: 10px;
    }

    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
      padding-bottom: 10px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
      flex-wrap: wrap;
      gap: 8px;
    }

    .btn-group {
      display: flex;
      gap: 8px;
      align-items: center;
      flex-wrap: wrap;
    }

    .file-btn, .icon-btn {
      background: rgba(0, 240, 255, 0.1);
      border: 1px solid var(--accent-color);
      color: var(--accent-color);
      padding: 6px 12px;
      border-radius: 6px;
      font-size: 0.8rem;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 4px;
      transition: all 0.2s;
    }

    .ai-top-btn {
      background: rgba(176, 38, 255, 0.1);
      border-color: var(--ai-color);
      color: var(--ai-color);
      font-size: 1.1rem;
      padding: 4px 10px;
    }
    .ai-top-btn:hover { background: rgba(176, 38, 255, 0.25); }

    .version-tag {
      background: rgba(0, 240, 255, 0.2);
      color: var(--accent-color);
      padding: 2px 6px;
      border-radius: 4px;
      font-size: 0.7rem;
      font-weight: bold;
    }

    .nav-info {
      font-size: 0.8rem;
      color: var(--ru-color);
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .reader-card {
      background: rgba(0, 0, 0, 0.4);
      border-radius: 10px;
      padding: 18px;
      margin-bottom: 15px;
      position: relative;
    }

    .speak-btn {
      position: absolute;
      top: 10px;
      right: 10px;
      background: transparent;
      border: none;
      font-size: 1.2rem;
      cursor: pointer;
    }

    .en-display {
      font-size: 1.35rem;
      line-height: 1.7;
      margin-bottom: 15px;
      word-wrap: break-word;
      user-select: none;
      min-height: 60px;
      padding-right: 30px;
    }

    .word-span {
      display: inline-block;
      cursor: pointer;
      border-radius: 4px;
      padding: 0 2px;
      transition: background 0.15s;
    }

    .word-span:hover {
      background: rgba(0, 240, 255, 0.15);
    }

    .char {
      color: var(--text-main);
      border-bottom: 2px solid transparent;
    }

    .char.typed { color: var(--typed-color); }
    .char.error {
      background-color: var(--error-bg);
      color: var(--error-color);
    }

    .char.cursor {
      border-bottom-color: var(--accent-color);
      animation: blink 1s infinite;
    }

    @keyframes blink { 50% { border-bottom-color: transparent; } }

    .ru-display {
      font-size: 1.05rem;
      color: var(--ru-color);
      font-style: italic;
      border-top: 1px dashed rgba(255, 255, 255, 0.1);
      padding-top: 10px;
    }

    .controls { display: flex; flex-direction: column; gap: 10px; }
    .slider-wrapper { display: flex; align-items: center; gap: 10px; }
    .slider { flex-grow: 1; accent-color: var(--accent-color); }
    
    #hiddenInput {
      position: absolute;
      opacity: 0;
      top: -1000px;
      left: -1000px;
    }

    /* Модальные окна */
    .modal {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0,0,0,0.8);
      display: none;
      justify-content: center;
      align-items: center;
      z-index: 2000;
      padding: 20px;
    }

    .modal-content {
      background: #1e293b;
      border: 1px solid var(--accent-color);
      border-radius: 12px;
      padding: 20px;
      max-width: 500px;
      width: 100%;
      box-shadow: 0 10px 25px rgba(0,0,0,0.8);
      position: relative;
    }

    .ai-modal-content { border-color: var(--ai-color); }

    .modal-close {
      position: absolute;
      top: 10px; right: 12px;
      background: transparent;
      border: none;
      color: var(--ru-color);
      font-size: 1.2rem;
      cursor: pointer;
    }

    .setting-row { margin-top: 14px; display: flex; flex-direction: column; gap: 6px; }
    .setting-row label { font-size: 0.85rem; color: var(--ru-color); }
    .setting-row select, .setting-row input[type="range"] {
      background: #0d0f17;
      color: var(--text-main);
      border: 1px solid rgba(255,255,255,0.2);
      padding: 8px;
      border-radius: 6px;
      outline: none;
    }

    .danger-btn {
      background: rgba(239, 68, 68, 0.2);
      border: 1px solid #ef4444;
      color: #ef4444;
      padding: 8px;
      border-radius: 6px;
      cursor: pointer;
      margin-top: 15px;
      width: 100%;
    }

    .modal-word { font-size: 1.5rem; color: var(--accent-color); font-weight: bold; margin-bottom: 6px; }
    .modal-trans { font-size: 1.25rem; color: #10b981; margin-bottom: 10px; font-weight: bold; }
    .modal-details {
      font-size: 0.85rem; color: var(--text-main);
      line-height: 1.4; border-top: 1px solid rgba(255,255,255,0.1); padding-top: 8px;
    }

    /* Окно ИИ-чата */
    .ai-chat-box {
      background: rgba(0, 0, 0, 0.3);
      border: 1px solid rgba(176, 38, 255, 0.2);
      border-radius: 8px;
      padding: 16px;
      margin-top: 12px;
      max-height: 380px;
      overflow-y: auto;
      color: var(--text-main);
      font-size: 0.95rem;
      line-height: 1.5;
    }
    
    .ai-chat-box b { color: var(--accent-color); }
    .ai-chat-box i { color: #a5b4fc; }
    .ai-chat-box code { background: #000; padding: 2px 5px; border-radius: 4px; color: #10b981; }
    
    .ai-loading {
      color: var(--ai-color);
      font-style: italic;
      text-align: center;
      padding: 20px 0;
      animation: pulse 1.5s infinite;
    }
    @keyframes pulse { 0% { opacity: 0.5; } 50% { opacity: 1; } 100% { opacity: 0.5; } }

  </style>
</head>
<body>

<div class="container" onclick="focusInput()">
  <div class="top-bar">
    <div class="btn-group">
      <label class="file-btn">
        📁 TXT
        <input type="file" id="fileInput" accept=".txt" style="display:none;">
      </label>
      <button class="icon-btn" onclick="openSettings(event)">⚙️ Настройки</button>
      <button class="icon-btn ai-top-btn" onclick="callAITutor(event)" title="ИИ-Репетитор (Ctrl + Space)">🤖</button>
    </div>
    <div class="nav-info">
      <span id="navInfo">Предложение 1/1</span>
      <span class="version-tag">v2.5</span>
    </div>
  </div>

  <div class="reader-card">
    <button class="speak-btn" onclick="speakSentence(event)">🔊</button>
    <div class="en-display" id="enDisplay"></div>
    <div class="ru-display" id="ruDisplay">Загрузка перевода...</div>
  </div>
