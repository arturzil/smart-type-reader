<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SmartBook Cyber-Type v2.6</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --panel-bg: #1e293b;
            --text-color: #e2e8f0;
            --accent-color: #38bdf8;
            --hover-color: #0284c7;
            --ru-text-color: #94a3b8;
            --border-color: #334155;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .container {
            max-width: 900px;
            width: 100%;
        }

        header {
            background-color: var(--panel-bg);
            padding: 20px;
            border-radius: 12px;
            border: 1px solid var(--border-color);
            margin-bottom: 20px;
            display: flex;
            flex-wrap: wrap;
            gap: 15px;
            justify-content: space-between;
            align-items: center;
        }

        .mode-badge {
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 0.85em;
            font-weight: bold;
            text-transform: uppercase;
        }

        .mode-offline { background-color: #15803d; color: #fff; }
        .mode-online { background-color: #b45309; color: #fff; }

        .file-inputs {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .file-group {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 0.9em;
        }

        input[type="file"] {
            font-size: 0.85em;
        }

        #reader {
            background-color: var(--panel-bg);
            padding: 30px;
            border-radius: 12px;
            border: 1px solid var(--border-color);
            line-height: 1.8;
            font-size: 1.1em;
            min-height: 400px;
        }

        .sentence-block {
            margin-bottom: 18px;
            padding-bottom: 12px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
        }

        .en-sentence {
            display: block;
            margin-bottom: 4px;
        }

        .ru-sentence {
            display: block;
            color: var(--ru-text-color);
            font-size: 0.95em;
            font-style: italic;
        }

        .word {
            cursor: pointer;
            padding: 2px 4px;
            border-radius: 4px;
            transition: background-color 0.2s, color 0.2s;
        }

        .word:hover {
            background-color: var(--accent-color);
            color: #000;
        }

        /* Tooltip style */
        #tooltip {
            position: fixed;
            display: none;
            background-color: #090d16;
            color: #fff;
            padding: 10px 16px;
            border-radius: 8px;
            border: 1px solid var(--accent-color);
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            z-index: 1000;
            max-width: 300px;
            pointer-events: none;
        }

        .tooltip-word {
            font-weight: bold;
            color: var(--accent-color);
            margin-bottom: 4px;
        }
    </style>
</head>
<body>

<div class="container">
    <header>
        <div>
            <h2>SmartBook Cyber-Type v2.6</h2>
            <span id="modeStatus" class="mode-badge mode-online">Режим: Не выбран</span>
        </div>
        <div class="file-inputs">
            <div class="file-group">
                <label><b>Офлайн (2x JSON):</b></label>
                <input type="file" id="jsonFilesInput" multiple accept=".json">
            </div>
            <div class="file-group">
                <label><b>Онлайн (1x TXT):</b></label>
                <input type="file" id="txtFileInput" accept=".txt">
            </div>
        </div>
    </header>

    <main id="reader">
        <p style="color: #64748b; text-align: center;">Выберите 2 JSON файла (книга + словарь) для офлайн-режима или 1 TXT файл для онлайн-режима.</p>
    </main>
</div>

<div id="tooltip">
    <div id="tooltipWord" class="tooltip-word"></div>
    <div id="tooltipText"></div>
</div>

<script>
    // Состояние приложения
    let isOfflineMode = false;
    let offlineDictionary = {};
    let bookData = []; // [{ en: "...", ru: "..." }]

    const readerEl = document.getElementById('reader');
    const modeStatusEl = document.getElementById('modeStatus');
    const tooltipEl = document.getElementById('tooltip');
    const tooltipWordEl = document.getElementById('tooltipWord');
    const tooltipTextEl = document.getElementById('tooltipText');

    // --- ОБРАБОТКА ЗАГРУЗКИ ФАЙЛОВ ---

    // 1. Загрузка 2x JSON (ОФЛАЙН РЕЖИМ)
    document.getElementById('jsonFilesInput').addEventListener('change', async function(e) {
        const files = Array.from(e.target.files);
        if (files.length < 2) {
            alert("Пожалуйста, выберите одновременно ДВА JSON-файла: книгу и словарь.");
            return;
        }

        isOfflineMode = true;
        updateModeUI("Офлайн (JSON)", "mode-offline");

        let loadedBook = null;
        let loadedDict = null;

        for (const file of files) {
            const text = await file.text();
            const json = JSON.parse(text);

            // Определение типа файла по структуре
            if (Array.isArray(json) && json.length > 0 && ('en' in json[0] || 'en_text' in json[0])) {
                loadedBook = json;
            } else if (typeof json === 'object' && !Array.isArray(json)) {
                loadedDict = json;
            } else if (Array.isArray(json) && json.length > 0 && ('word' in json[0] || 'key' in json[0])) {
                // Если словарь представлен массивом объектов [{word: "...", translation: "..."}]
                loadedDict = {};
                json.forEach(item => {
                    const key = (item.word || item.key || '').toLowerCase();
                    if (key) loadedDict[key] = item.translation || item.value || item.ru;
                });
            }
        }

        if (loadedBook) {
            bookData = loadedBook.map(item => ({
                en: item.en || item.en_text || '',
                ru: item.ru || item.ru_text || ''
            }));
        }

        if (loadedDict) {
            // Приводим все ключи словаря к нижнему регистру для надежности поиска
            offlineDictionary = {};
            for (const [key, val] of Object.entries(loadedDict)) {
                offlineDictionary[key.toLowerCase()] = val;
            }
        }

        renderBook();
    });

    // 2. Загрузка TXT (ОНЛАЙН РЕЖИМ)
    document.getElementById('txtFileInput').addEventListener('change', async function(e) {
        const file = e.target.files[0];
        if (!file) return;

        isOfflineMode = false;
        offlineDictionary = {};
        updateModeUI("Онлайн (TXT)", "mode-online");

        const text = await file.text();
        // Разбиваем TXT на условные предложения по точкам
        const sentences = text.match(/[^.!?]+[.!?]+/g) || [text];
        
        bookData = sentences.map(s => ({
            en: s.trim(),
            ru: "" // В онлайн режиме перевод предложения отсутствует до запроса
        }));

        renderBook();
    });

    // --- РЕНДЕРИНГ ТЕКСТА ---

    function renderBook() {
        readerEl.innerHTML = '';
        if (bookData.length === 0) {
            readerEl.innerHTML = '<p>Ошибка чтения структуры файла.</p>';
            return;
        }

        const fragment = document.createDocumentFragment();

        bookData.forEach((item) => {
            const block = document.createElement('div');
            block.className = 'sentence-block';

            const enSpan = document.createElement('span');
            enSpan.className = 'en-sentence';

            // Оборачиваем каждое слово в span.word
            const words = item.en.split(/(\s+)/);
            words.forEach(chunk => {
                if (/\s+/.test(chunk) || chunk === '') {
                    enSpan.appendChild(document.createTextNode(chunk));
                } else {
                    const wordSpan = document.createElement('span');
                    wordSpan.className = 'word';
                    wordSpan.textContent = chunk;
                    wordSpan.addEventListener('click', (e) => handleWordClick(e, chunk));
                    enSpan.appendChild(wordSpan);
                }
            });

            block.appendChild(enSpan);

            // Если есть параллельный перевод предложения, отображаем его
            if (item.ru) {
                const ruSpan = document.createElement('span');
                ruSpan.className = 'ru-sentence';
                ruSpan.textContent = item.ru;
                block.appendChild(ruSpan);
            }

            fragment.appendChild(block);
        });

        readerEl.appendChild(fragment);
    }

    // --- ОБРАБОТКА КЛИКА ПО СЛОВУ ---

    async function handleWordClick(event, rawWord) {
        // Очищаем слово от знаков препинания и приводим к нижнему регистру
        const cleanWord = rawWord.toLowerCase().replace(/[^a-z0-9'-]/gi, '');
        if (!cleanWord) return;

        // Позиционируем плашку с переводом возле мыши
        showTooltip(event.clientX, event.clientY, rawWord, "Загрузка...");

        // --- 1. СТРОГИЙ ОФЛАЙН РЕЖИМ (JSON) ---
        if (isOfflineMode) {
            // Ищем слово в локальном словаре
            if (offlineDictionary[cleanWord]) {
                const translation = offlineDictionary[cleanWord];
                // Если перевод является объектом, извлекаем значение
                const resultText = typeof translation === 'object' 
                    ? (translation.ru || translation.translation || JSON.stringify(translation))
                    : translation;
                
                showTooltip(event.clientX, event.clientY, rawWord, resultText);
            } else {
                // Если слова нет в файле — сразу выводим ответ БЕЗ обращения к сетевому API
                showTooltip(event.clientX, event.clientY, rawWord, "Перевод не найден в офлайн-словаре");
            }
            return; // Завершаем выполнение функции!
        }

        // --- 2. ОНЛАЙН РЕЖИМ (TXT) ---
        try {
            const response = await fetch(`https://api.dictionaryapi.dev/api/v2/entries/en/${cleanWord}`);
            if (!response.ok) throw new Error("Не найдено");
            
            const data = await response.json();
            const definition = data[0]?.meanings[0]?.definitions[0]?.definition || "Перевод не найден";
            showTooltip(event.clientX, event.clientY, rawWord, definition);
        } catch (err) {
            showTooltip(event.clientX, event.clientY, rawWord, "Ошибка онлайн-перевода");
        }
    }

    // --- ВСПОМОГАТЕЛЬНЫЕ ФУНКЦИИ UI ---

    function showTooltip(x, y, word, text) {
        tooltipWordEl.textContent = word;
        tooltipTextEl.textContent = text;
        tooltipEl.style.display = 'block';
        
        // Корректировка позиции всплывающего окна
        const posX = Math.min(x + 10, window.innerWidth - 320);
        const posY = y + 15;
        
        tooltipEl.style.left = `${posX}px`;
        tooltipEl.style.top = `${posY}px`;
    }

    function updateModeUI(text, className) {
        modeStatusEl.textContent = `Режим: ${text}`;
        modeStatusEl.className = `mode-badge ${className}`;
    }

    // Скрытие всплывающего окна при клике в любое другое место
    document.addEventListener('click', (e) => {
        if (!e.target.classList.contains('word')) {
            tooltipEl.style.display = 'none';
        }
    });
</script>
</body>
</html>
