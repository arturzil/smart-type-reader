<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>SmartBook Cyber-Type v1.3</title>
  <style>
    :root {
      --bg-color: #0d0f17;
      --card-bg: #161925;
      --accent-color: #00f0ff;
      --text-main: #e2e8f0;
      --text-dim: #475569;
      --typed-color: #ef4444;
      --error-bg: rgba(239, 68, 68, 0.3);
      --ru-color: #94a3b8;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'JetBrains Mono', 'Fira Code', 'Consolas', system-ui, monospace;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      display: flex;
      justify-content: center;
      align-items: flex-start; /* Фиксируем контейнер вверху экрана */
      min-height: 100vh;
      padding: 15px 10px;
    }

    .container {
      background-color: var(--card-bg);
      border: 1px solid rgba(0, 240, 255, 0.2);
      border-radius: 14px;
      padding: 16px;
      max-width: 800px;
      width: 100%;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
      margin-top: 10px;
    }

    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
      padding-bottom: 10px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
    }

    .file-btn {
      background: rgba(0, 240, 255, 0.1);
      border: 1px solid var(--accent-color);
      color: var(--accent-color);
      padding: 6px 12px;
      border-radius: 6px;
      font-size: 0.8rem;
      cursor: pointer;
    }

    .version-tag {
      background: rgba(0, 240, 255, 0.2);
      color: var(--accent-color);
      padding: 2px 6px;
      border-radius: 4px;
      font-size: 0.7rem;
      font-weight: bold;
      margin-left: 8px;
    }

    .nav-info {
      font-size: 0.8rem;
      color: var(--ru-color);
      display: flex;
      align-items: center;
    }

    .reader-card {
      background: rgba(0, 0, 0, 0.4);
      border-radius: 10px;
      padding: 18px;
      margin-bottom: 15px;
      position: relative;
    }

    .speak-btn {
      position: absolute;
      top: 10px;
      right: 10px;
      background: transparent;
      border: none;
      font-size: 1.2rem;
      cursor: pointer;
    }

    .en-display {
      font-size: 1.35rem;
      line-height: 1.7;
      margin-bottom: 15px;
      word-wrap: break-word;
      user-select: none;
      min-height: 60px;
      padding-right: 30px;
    }

    .word-span {
      display: inline-block;
      cursor: pointer;
      border-radius: 4px;
      padding: 0 2px;
      transition: background 0.15s;
    }

    .word-span:hover {
      background: rgba(0, 240, 255, 0.15);
    }

    .char {
      color: var(--text-main);
      border-bottom: 2px solid transparent;
    }

    .char.typed {
      color: var(--typed-color);
    }

    .char.error {
      background-color: var(--error-bg);
      color: #ff8888;
    }

    .char.cursor {
      border-bottom-color: var(--accent-color);
      animation: blink 1s infinite;
    }

    @keyframes blink {
      50% { border-bottom-color: transparent; }
    }

    .ru-display {
      font-size: 1.05rem;
      color: var(--ru-color);
      font-style: italic;
      border-top: 1px dashed rgba(255, 255, 255, 0.1);
      padding-top: 10px;
    }

    .controls {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .slider-wrapper {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .slider {
      flex-grow: 1;
      accent-color: var(--accent-color);
    }

    #hiddenInput {
      position: absolute;
      opacity: 0;
      top: -1000px;
      left: -1000px;
    }

    /* Модальное окно перевода слова */
    .word-modal {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0,0,0,0.75);
      display: none;
      justify-content: center;
      align-items: center;
      z-index: 2000;
      padding: 20px;
    }

    .word-modal-content {
      background: #1e293b;
      border: 1px solid var(--accent-color);
      border-radius: 12px;
      padding: 20px;
      max-width: 380px;
      width: 100%;
      box-shadow: 0 10px 25px rgba(0,0,0,0.8);
      position: relative;
    }

    .modal-close {
      position: absolute;
      top: 10px; right: 12px;
      background: transparent;
      border: none;
      color: var(--ru-color);
      font-size: 1.2rem;
      cursor: pointer;
    }

    .modal-word {
      font-size: 1.5rem;
      color: var(--accent-color);
      font-weight: bold;
      margin-bottom: 6px;
    }

    .modal-trans {
      font-size: 1.25rem;
      color: #10b981;
      margin-bottom: 10px;
      font-weight: bold;
    }

    .modal-details {
      font-size: 0.85rem;
      color: var(--text-main);
      line-height: 1.4;
      border-top: 1px solid rgba(255,255,255,0.1);
      padding-top: 8px;
    }
  </style>
</head>
<body>

<div class="container" onclick="focusInput()">
  <div class="top-bar">
    <label class="file-btn">
      📁 Загрузить TXT
      <input type="file" id="fileInput" accept=".txt" style="display:none;">
    </label>
    <div class="nav-info">
      <span id="navInfo">Предложение 1/1</span>
      <span class="version-tag">v1.3-beta</span>
    </div>
  </div>

  <div class="reader-card">
    <button class="speak-btn" onclick="speakSentence(event)">🔊</button>
    <div class="en-display" id="enDisplay"></div>
    <div class="ru-display" id="ruDisplay">Загрузка перевода...</div>
  </div>

  <div class="controls">
    <div class="slider-wrapper">
      <button class="file-btn" onclick="prevSentence(event)">◄</button>
      <input type="range" id="sentenceSlider" class="slider" min="0" value="0">
      <button class="file-btn" onclick="nextSentence(event)">►</button>
    </div>
  </div>
</div>

<!-- Модальное окно для слова -->
<div class="word-modal" id="wordModal" onclick="closeModal()">
  <div class="word-modal-content" onclick="event.stopPropagation()">
    <button class="modal-close" onclick="closeModal()">✕</button>
    <div class="modal-word" id="modalWord">Word</div>
    <div class="modal-trans" id="modalTrans">Загрузка...</div>
    <div class="modal-details" id="modalDetails"></div>
  </div>
</div>

<input type="text" id="hiddenInput" autocomplete="off" autocapitalize="off" spellcheck="false">

<script>
  let sentences = [
    "If I survive this, I will need a very strong drink.",
    "The ship computer handles orbital navigation automatically.",
    "System diagnostics revealed a critical error in the main reactor."
  ];
  
  let currentIndex = 0;
  let currentWordIndex = -1;
  const synth = window.speechSynthesis;
  const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

  const savedIndex = localStorage.getItem('smartbook_index');
  if (savedIndex) currentIndex = parseInt(savedIndex);

  const enDisplay = document.getElementById('enDisplay');
  const ruDisplay = document.getElementById('ruDisplay');
  const hiddenInput = document.getElementById('hiddenInput');
  const slider = document.getElementById('sentenceSlider');
  const navInfo = document.getElementById('navInfo');

  function playErrorSound() {
    try {
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = 'sawtooth';
      osc.frequency.value = 150;
      gain.gain.value = 0.1;
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start();
      osc.stop(audioCtx.currentTime + 0.15);
    } catch(e) {}
  }

  function speak(text) {
    if (!synth) return;
    synth.cancel();
    const u = new SpeechSynthesisUtterance(text);
    u.lang = 'en-US';
    u.rate = 0.9;
    synth.speak(u);
  }

  function speakSentence(e) {
    if (e) e.stopPropagation();
    speak(sentences[currentIndex]);
  }

  async function fetchContextTranslation(index) {
    ruDisplay.textContent = "Переводим...";
    const curr = sentences[index];

    try {
      const res = await fetch(`https://translate.googleapis.com/translate_a/single?client=gtx&sl=en&tl=ru&dt=t&q=${encodeURIComponent(curr)}`);
      const data = await res.json();
      let fullTrans = "";
      if (data && data[0]) {
        data[0].forEach(item => {
          if (item[0]) fullTrans += item[0];
        });
      }
      ruDisplay.textContent = fullTrans || "Не удалось получить перевод";
    } catch(e) {
      ruDisplay.textContent = "Ошибка подключения к сервису перевода";
    }
  }

  async function inspectWord(wordStr, event) {
    if (event) event.stopPropagation();
    
    const cleanWord = wordStr.replace(/[^a-zA-Z]/g, "").trim();
    if (!cleanWord) return;

    document.getElementById('modalWord').textContent = cleanWord;
    document.getElementById('modalTrans').textContent = "Загрузка перевода...";
    document.getElementById('modalDetails').textContent = "";
    document.getElementById('wordModal').style.display = 'flex';

    speak(cleanWord);

    try {
      const res = await fetch(`https://translate.googleapis.com/translate_a/single?client=gtx&sl=en&tl=ru&dt=t&q=${encodeURIComponent(cleanWord)}`);
      const data = await res.json();
      
      let wordTranslation = "";
      if (data && data[0] && data[0][0] && data[0][0][0]) {
        wordTranslation = data[0][0][0];
      }
      document.getElementById('modalTrans').textContent = wordTranslation || "Перевод не найден";
    } catch(e) {
      document.getElementById('modalTrans').textContent = "Ошибка получения перевода";
    }

    try {
      const dictRes = await fetch(`https://api.dictionaryapi.dev/api/v2/entries/en/${cleanWord.toLowerCase()}`);
      if (dictRes.ok) {
        const dictData = await dictRes.json();
        const entry = dictData[0];
        let detailsHtml = "";
        if (entry.meanings) {
          entry.meanings.slice(0, 2).forEach(m => {
            if (m.definitions && m.definitions[0]) {
              detailsHtml += `<div style="margin-top:4px;"><b>[${m.partOfSpeech}]</b> ${m.definitions[0].definition}</div>`;
            }
          });
        }
        document.getElementById('modalDetails').innerHTML = detailsHtml;
      }
    } catch(e) {}
  }

  function closeModal() {
    document.getElementById('wordModal').style.display = 'none';
    focusInput();
  }

  function render() {
    const text = sentences[currentIndex];
    enDisplay.innerHTML = '';
    
    let globalCharIndex = 0;
    const words = text.split(' ');

    words.forEach((word, wIdx) => {
      const wordSpan = document.createElement('span');
      wordSpan.className = 'word-span';

      wordSpan.addEventListener('click', (e) => inspectWord(word, e));

      word.split('').forEach((char) => {
        const charIdx = globalCharIndex;
        const span = document.createElement('span');
        span.className = 'char';
        span.textContent = char;

        if (charIdx < hiddenInput.value.length) {
          if (hiddenInput.value[charIdx] === text[charIdx]) {
            span.classList.add('typed');
          } else {
            span.classList.add('error');
          }
        }

        if (charIdx === hiddenInput.value.length) {
          span.classList.add('cursor');
        }

        wordSpan.appendChild(span);
        globalCharIndex++;
      });

      enDisplay.appendChild(wordSpan);

      if (wIdx < words.length - 1) {
        const spaceCharIdx = globalCharIndex;
        const spaceSpan = document.createElement('span');
        spaceSpan.className = 'char';
        spaceSpan.textContent = ' ';

        if (spaceCharIdx < hiddenInput.value.length) {
          if (hiddenInput.value[spaceCharIdx] === text[spaceCharIdx]) {
            spaceSpan.classList.add('typed');
          } else {
            spaceSpan.classList.add('error');
          }
        }

        if (spaceCharIdx === hiddenInput.value.length) {
          spaceSpan.classList.add('cursor');
        }

        enDisplay.appendChild(spaceSpan);
        globalCharIndex++;
      }
    });

    if (hiddenInput.value === text && text.length > 0) {
      setTimeout(() => {
        nextSentence();
      }, 300);
    }

    slider.max = sentences.length - 1;
    slider.value = currentIndex;
    navInfo.textContent = `Предложение ${currentIndex + 1}/${sentences.length}`;
  }

  function checkWordPronunciation() {
    const text = sentences[currentIndex];
    const typed = hiddenInput.value;
    const words = text.split(' ');
    
    let charCount = 0;
    for (let i = 0; i < words.length; i++) {
      const wordStart = charCount;
      const wordEnd = charCount + words[i].length;
      
      if (typed.length >= wordStart && typed.length < wordEnd) {
        if (currentWordIndex !== i) {
          currentWordIndex = i;
          speak(words[i].replace(/[^a-zA-Z]/g, ""));
        }
        break;
      }
      charCount = wordEnd + 1;
    }
  }

  function loadSentence(index) {
    currentIndex = Math.max(0, Math.min(index, sentences.length - 1));
    currentWordIndex = -1;
    hiddenInput.value = '';
    localStorage.setItem('smartbook_index', currentIndex);
    fetchContextTranslation(currentIndex);
    render();
    speakSentence();
  }

  function nextSentence(e) {
    if (e) e.stopPropagation();
    if (currentIndex < sentences.length - 1) loadSentence(currentIndex + 1);
  }

  function prevSentence(e) {
    if (e) e.stopPropagation();
    if (currentIndex > 0) loadSentence(currentIndex - 1);
  }

  hiddenInput.addEventListener('input', () => {
    const text = sentences[currentIndex];
    const val = hiddenInput.value;
    const lastTypedChar = val[val.length - 1];
    const expectedChar = text[val.length - 1];

    if (lastTypedChar && lastTypedChar !== expectedChar) {
      playErrorSound();
    } else {
      checkWordPronunciation();
    }

    render();
  });

  document.getElementById('fileInput').addEventListener('change', (e) => {
    const file = e.target.files[0];
    if (!file) return;

    const reader = new FileReader();
    reader.onload = function(evt) {
      const rawText = evt.target.result;
      sentences = rawText
        .replace(/\r?\n|\r/g, " ")
        .split(/(?<=[.!?])\s+/)
        .map(s => s.trim())
        .filter(s => s.length > 5);

      if (sentences.length > 0) {
        loadSentence(0);
      }
    };
    reader.readAsText(file);
  });

  slider.addEventListener('input', (e) => {
    loadSentence(parseInt(e.target.value));
  });

  function focusInput() {
    hiddenInput.focus();
  }

  loadSentence(currentIndex);
</script>
</body>
</html>
